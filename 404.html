          window.location.replace('/posts/page/' + pageNum + '/');

        return;
      }

      // 6. 年份归档跳转：/archives/YYYY/ → /posts/
      match = currentPath.match(/^\/archives\/(\d{4})\/?$/);
      if (match) {
        window.location.replace('/posts/');
        return;
      }

      // 7. archives 根路径跳转：/archives/ → /posts/
      if (currentPath === '/archives/' || currentPath === '/archives') {
        window.location.replace('/posts/');
        return;
      }

      // 8. WordPress 标签路径：/tag/... → /tags/
      if (currentPath.indexOf('/tag/') === 0) {
        window.location.replace('/tags/');
        return;
      }

      // 9. WordPress 分类路径：/category/... → /categories/
      if (currentPath.indexOf('/category/') === 0) {
        window.location.replace('/categories/');
        return;
      }

      // 10. 作者页：/author/... → /about/
      if (currentPath.indexOf('/author/') === 0) {
        window.location.replace('/about/');
        return;
      }

      // 11. RSS 订阅：/feed/ 或 /rss/ → /rss2.xml
      if (currentPath === '/feed/' || currentPath === '/feed' || currentPath === '/rss/' || currentPath === '/rss') {
        window.location.replace('/rss2.xml');
        return;
      }

      // 12. WordPress 后台相关路径：跳首页
      if (currentPath.indexOf('/wp-admin') === 0 || currentPath.indexOf('/wp-content') === 0 || currentPath.indexOf('/wp-json') === 0 || currentPath.indexOf('/wp-includes') === 0) {
        window.location.replace('/');
        return;
      }

      /* ---------- 原有 404 逻辑 ----------
       * 如果没有匹配到跳转规则，执行原有的 404 兜底逻辑
       */
      var timer = document.querySelector('[data-redirect-url]');
      var linkHome = document.querySelector('[data-nf-home]');
      var linkPosts = document.querySelector('[data-nf-posts]');
      var stylesheet = document.querySelector('link[rel="stylesheet"]');

      /* ---------- 站点根探测（双宿主契约） ----------
       * 404 页会被静态托管服务在任意深度的未知路径下（404.html 内容 + 真 404 状态码），
       * 「回首页」必须落到宿主站点根：根部署（sgguy.com）为 /，GitHub Pages 项目页
       * 部署（yqdaddy.github.io/mazaibang-web/）为 /mazaibang-web/。
       * 探测：逐级 fetch .nojekyll（Hexo 部署到 GitHub Pages 必带、大小 0，纯静态哨兵，
       * 同源请求无 CORS 问题）；候选从根开始逐级加深，正式域名一级即中；
       * GitHub Pages 对不存在路径返回真 404 状态码，不会误报 ok。
       * 全部候选失败（如自建托管未带 .nojekyll）回退根部署形态 /。 */
      var probeCandidates = (function () {
        var parts = window.location.pathname.split('/').filter(Boolean);
        var list = ['/'];
        for (var i = 0; i < parts.length; i++) {
          list.push('/' + parts.slice(0, i + 1).join('/') + '/');
        }
        return list;
      })();

      function fetchOk(url) {
        var controller = typeof AbortController === 'function' ? new AbortController() : null;
        // 单候选 1.2s 超时：两候选链最坏 2.4s，落在重定向 cap（~5.5s）内不会静默降级到错误落点
        var timerId = controller ? setTimeout(function () { controller.abort(); }, 1200) : null;
        return fetch(url, { credentials: 'same-origin', signal: controller ? controller.signal : undefined })
          .then(function (res) { return res.ok; })
          .catch(function () { return false; })
          .then(function (ok) {
            if (timerId) clearTimeout(timerId);
            return ok;
          });
      }

      var siteRootPromise = (function () {
        var index = 0;
        function next() {
          if (index >= probeCandidates.length) return Promise.resolve('/');
          var candidate = probeCandidates[index++];
          return fetchOk(candidate + '.nojekyll').then(function (ok) {
            return ok ? candidate : next();
          });
        }
        return next();
      })();

      function capByMs(promise, ms, fallbackValue) {
        return new Promise(function (resolve) {
          var done = false;
          promise.then(function (v) { if (!done) { done = true; resolve(v); } });
          setTimeout(function () { if (!done) { done = true; resolve(fallbackValue); } }, ms);
        });
      }

      /* 探测落定为子路径宿主时，把静态层（根部署形态）引用升级到真实站点根；
         根部署（'/'）时一切保持静态初值，零额外改动 */
      function applySiteRoot(root) {
        if (!root || root === '/') return;
        if (timer) timer.setAttribute('data-redirect-url', root);
        if (linkHome) linkHome.setAttribute('href', root);
        if (linkPosts) linkPosts.setAttribute('href', root + 'posts/');
        if (stylesheet) stylesheet.setAttribute('href', root + 'css/style.css');
      }
      siteRootPromise.then(applySiteRoot);

      /* ---------- 4 秒倒计时跳转（保留 ?redirect=0 测试钩子） ---------- */
      var num = document.querySelector('[data-countdown]');
      var suffix = document.querySelector('.nf-timer__suffix');
      var left = 4;
      function render() {
        if (num) num.textContent = String(left);
        if (suffix) suffix.textContent = ' 秒后自动回首页';
      }
      render();
      // E2E 与人工检查用测试钩子：?redirect=0 停用自动跳转（文案仍填充）
      if (new URLSearchParams(window.location.search).get('redirect') === '0') return;
      var t = setInterval(function () {
        left -= 1;
        if (left <= 0) {
          clearInterval(t);
          // 跳转目标等待探测结果；探测链异常时 1.5s 上限后回退根部署形态
          capByMs(siteRootPromise, 1500, '/').then(function (root) {
            window.location.replace(root);
          });
          return;
        }
        render();
      }, 1000);
    })();
  </script>
</body>
</html>
